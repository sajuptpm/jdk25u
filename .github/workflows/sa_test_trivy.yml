name: Trivy Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-results.json

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Generate CSV Report
        run: |
          echo "Package,InstalledVersion,CVE,Severity,FixedVersion" > trivy-report.csv

          jq -r '
            .Results[]? |
            .Vulnerabilities[]? |
            [
              .PkgName,
              .InstalledVersion,
              .VulnerabilityID,
              .Severity,
              (.FixedVersion // "N/A")
            ] | @csv
          ' trivy-results.json >> trivy-report.csv

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.csv

      - name: Workflow Summary
        run: |
          echo "## Trivy Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version | CVE | Severity | Fixed Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|-----|---------
