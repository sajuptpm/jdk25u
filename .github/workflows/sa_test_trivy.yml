name: Trivy Scan

on:
  workflow_dispatch:

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate CSV Report
        run: |
          echo "Package,Version,CVE,Severity,FixedVersion" > trivy-report.csv

          jq -r '
            .Results[]?.Vulnerabilities[]? |
            [
              .PkgName,
              .InstalledVersion,
              .VulnerabilityID,
              .Severity,
              (.FixedVersion // "N/A")
            ] | @csv
          ' trivy-results.json >> trivy-report.csv

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.csv
